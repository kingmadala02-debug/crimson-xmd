<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CRIMSON-XMD Panel - King 03</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}body{background:#06070a;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px} .card{width:100%;max-width:430px;background:rgba(17,19,31,0.9);border:1px solid rgba(193,18,31,0.25);border-radius:28px;padding:30px} .crown{width:62px;height:62px;background:linear-gradient(135deg,#ffd700,#ff9500);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 12px} .title{font-size:26px;font-weight:900;text-align:center} .title span{color:#ef233c} .sub{color:#6c7086;font-size:12px;text-align:center;margin-top:4px} .badge{display:flex;justify-content:center;margin-top:10px} .badge span{background:rgba(193,18,31,0.15);border:1px solid rgba(193,18,31,0.25);padding:5px 14px;border-radius:20px;font-size:10px;font-weight:800;color:#ef476f} .divider{height:1px;background:linear-gradient(90deg,transparent,#c1121f35,transparent);margin:20px 0} .label{font-size:11px;font-weight:800;color:#8b8fa3;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:8px} input{width:100%;padding:15px;border-radius:14px;border:1.5px solid #1e2135;background:#0a0c14;color:#fff;font-size:15px;font-weight:600;outline:none} .btn{width:100%;padding:15px;border-radius:14px;border:0;font-weight:900;font-size:14px;cursor:pointer;margin-top:12px;display:flex;justify-content:center;gap:8px} .btn-blood{background:linear-gradient(135deg,#c1121f,#8b0000);color:#fff} .result{display:none;margin-top:18px;background:#07080d;border:1.5px dashed #c1121f;border-radius:16px;padding:18px;text-align:center} .code{font-size:30px;font-weight:900;letter-spacing:5px} .cmd{margin-top:8px;background:#0a0c14;border:1px solid #1e2135;padding:10px 14px;border-radius:10px;display:flex;justify-content:space-between;cursor:pointer;font-size:13px} .footer{margin-top:20px;text-align:center} .footer a{color:#6c7086;font-size:11px;text-decoration:none;margin:0 6px} .error{display:none;margin-top:12px;background:rgba(193,18,31,0.1);border:1px solid rgba(193,18,31,0.3);padding:10px;border-radius:10px;color:#ff4d6d;font-size:12px;text-align:center}</style></head><body><div class="card"><div class="crown">👑</div><div class="title">CRIMSON <span>XMD</span></div><div class="sub">Secure Pair Code Generator</div><div class="badge"><span>🩸 ALPHA EDITION BY KING 03 🩸</span></div><div class="divider"></div><div class="label">👑 WhatsApp Number</div><input id="number" value="254" placeholder="2547XXXXXXXX"><button class="btn btn-blood" onclick="getCode()">🩸 Generate Pair Code 🩸</button><div id="loading" style="display:none;margin-top:12px;text-align:center;color:#888;font-size:12px">Generating...</div><div id="result" class="result"><div style="font-size:10px;color:#6c7086;letter-spacing:2px">YOUR PAIR CODE</div><div id="code" class="code">---- ----</div><div style="font-size:11px;color:#4a4f69;margin-top:8px">WhatsApp > Linked Devices > Link with phone number</div><button class="btn" style="background:#11131f;border:1px solid #22263a;color:#fff" onclick="copyCode()">Copy Code</button></div><div id="error" class="error"></div><div style="margin-top:22px"><div class="label">🩸 Quick Commands</div><div class="cmd" onclick="copyCmd('.pair 2547xxxxxxx')"><span>.pair 2547xxxxxxx</span><span>👑</span></div><div class="cmd" onclick="copyCmd('.panel')"><span>.panel</span><span>🩸</span></div><div class="cmd" onclick="copyCmd('.menu')"><span>.menu</span><span>👑</span></div></div><div class="footer"><a href="https://whatsapp.com/channel/0029VbEPUuh5q08m91jnCD05">Channel</a><a href="https://chat.whatsapp.com/J1aaAiDxPos6PX1z8hTnTb">Group</a><div style="margin-top:8px;color:#2a2d44;font-size:10px">👑 CRIMSON-XMD 🩸 KING 03</div></div></div><script>async function getCode(){let n=document.getElementById('number').value.trim();if(n.length<10){showError('Enter valid number');return}document.getElementById('loading').style.display='block';document.getElementById('result').style.display='none';document.getElementById('error').style.display='none';try{let r=await fetch('/code?number='+encodeURIComponent(n));let d=await r.json();document.getElementById('loading').style.display='none';if(d.error){showError(d.error);return}document.getElementById('code').innerText=d.code;document.getElementById('result').style.display='block'}catch(e){document.getElementById('loading').style.display='none';showError('Server offline')}}function showError(t){let e=document.getElementById('error');e.innerText='🩸 '+t;e.style.display='block'}function copyCode(){navigator.clipboard.writeText(document.getElementById('code').innerText);alert('Code copied 👑')}function copyCmd(t){navigator.clipboard.writeText(t);alert('Copied '+t)}</script></body></html>
